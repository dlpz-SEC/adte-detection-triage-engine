# PARKED (2026-07-10): Render's GitHub auto-deploy link was severed by the
# 2026-06-17 repo recreation and was never reconnected — the Render service is
# stale. Railway (Dockerfile + railway.json) is the live deployment target.
# This file remains as inert, reconnectable config.
services:
  - type: web
    name: adte-detection-triage-engine
    runtime: python
    plan: free
    buildCommand: pip install . && cd frontend && npm install && npm run build
    startCommand: gunicorn adte.server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ADTE_DRY_RUN
        value: "true"
      - key: ADTE_EXECUTION_ENABLED
        value: "false"
      - key: ADTE_KILL_SWITCH
        value: "false"
      # Optional since ProxyFix (55c8d1f): leave UNSET for a same-origin deploy
      # (the Flask app serves the UI itself). Set only to permit a separately
      # hosted cross-origin frontend (exact scheme+host, no trailing slash).
      - key: ADTE_CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
